<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#1D9E75"/>
  <!-- laptop base -->
  <rect x="96" y="140" width="320" height="200" rx="16" fill="white" opacity="0.95"/>
  <rect x="112" y="156" width="288" height="168" rx="8" fill="#0F6E56"/>
  <!-- screen content lines -->
  <rect x="130" y="175" width="180" height="8" rx="4" fill="white" opacity="0.4"/>
  <rect x="130" y="195" width="120" height="6" rx="3" fill="white" opacity="0.3"/>
  <rect x="130" y="211" width="150" height="6" rx="3" fill="white" opacity="0.3"/>
  <!-- spider web center -->
  <circle cx="310" cy="230" r="48" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <circle cx="310" cy="230" r="32" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <circle cx="310" cy="230" r="16" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="310" y1="182" x2="310" y2="278" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="262" y1="230" x2="358" y2="230" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="276" y1="196" x2="344" y2="264" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <line x1="344" y1="196" x2="276" y2="264" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <!-- spider body -->
  <ellipse cx="310" cy="228" rx="10" ry="12" fill="white"/>
  <ellipse cx="310" cy="218" rx="7" ry="7" fill="white"/>
  <!-- legs -->
  <line x1="300" y1="222" x2="280" y2="210" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="300" y1="228" x2="278" y2="228" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="300" y1="234" x2="282" y2="244" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="320" y1="222" x2="340" y2="210" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="320" y1="228" x2="342" y2="228" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="320" y1="234" x2="338" y2="244" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- keyboard base -->
  <rect x="72" y="340" width="368" height="28" rx="8" fill="white" opacity="0.9"/>
  <rect x="192" y="340" width="128" height="8" rx="4" fill="#1D9E75" opacity="0.6"/>
